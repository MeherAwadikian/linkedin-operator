name: Deploy web to Cloudflare

# Move this file into .github/workflows/ once the repo token has the 'workflow'
# scope. Builds on Linux (where Next.js standalone symlinks work) and deploys the
# web app via the OpenNext Cloudflare adapter.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', '.github/workflows/deploy-cloudflare.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build + deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @lo/web cf:deploy
